<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#1a1a2a" stroke="#8888ff" stroke-width="2"/>
  <!-- Helmet dome -->
  <path d="M18,34 C18,20 24,14 32,14 C40,14 46,20 46,34 L46,38 L18,38 Z" fill="#3a3a5a" stroke="#8888ff" stroke-width="0.8" filter="url(#glow)"/>
  <!-- Visor -->
  <path d="M20,30 L44,30 L46,34 L44,38 L20,38 L18,34 Z" fill="#1a1a3a" stroke="#8888ff" stroke-width="0.6"/>
  <!-- Visor slit -->
  <rect x="22" y="32" width="20" height="3" rx="1" fill="#2a2a5a" stroke="#8888ff" stroke-width="0.4"/>
  <rect x="24" y="32.5" width="16" height="2" rx="0.5" fill="#8888ff" opacity="0.15"/>
  <!-- Armor ridge on top -->
  <path d="M32,14 L32,22" stroke="#8888ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M28,16 L32,14 L36,16" stroke="#8888ff" stroke-width="0.6" fill="none" opacity="0.4"/>
  <!-- Side armor plates -->
  <path d="M18,30 L16,34 L16,40 L20,42 L20,38" fill="#2a2a4a" stroke="#8888ff" stroke-width="0.5"/>
  <path d="M46,30 L48,34 L48,40 L44,42 L44,38" fill="#2a2a4a" stroke="#8888ff" stroke-width="0.5"/>
  <!-- Chin guard -->
  <path d="M22,38 L20,44 L26,46 L32,47 L38,46 L44,44 L42,38" fill="#3a3a5a" stroke="#8888ff" stroke-width="0.5"/>
  <!-- Rivet details -->
  <circle cx="22" cy="26" r="1" fill="#8888ff" opacity="0.4"/>
  <circle cx="42" cy="26" r="1" fill="#8888ff" opacity="0.4"/>
  <circle cx="24" cy="42" r="0.8" fill="#8888ff" opacity="0.3"/>
  <circle cx="40" cy="42" r="0.8" fill="#8888ff" opacity="0.3"/>
</svg>