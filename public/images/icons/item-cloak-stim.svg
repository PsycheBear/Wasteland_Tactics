<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#1a0a1a" stroke="#cc88ff" stroke-width="2"/>
  <!-- Syringe body - ghostly/transparent -->
  <rect x="28" y="16" width="8" height="24" rx="2" fill="#3a2a4a" stroke="#cc88ff" stroke-width="0.6" opacity="0.5" filter="url(#glow)"/>
  <!-- Syringe barrel lines (graduation marks) -->
  <line x1="29" y1="20" x2="35" y2="20" stroke="#cc88ff" stroke-width="0.3" opacity="0.3"/>
  <line x1="29" y1="24" x2="35" y2="24" stroke="#cc88ff" stroke-width="0.3" opacity="0.3"/>
  <line x1="29" y1="28" x2="35" y2="28" stroke="#cc88ff" stroke-width="0.3" opacity="0.3"/>
  <line x1="29" y1="32" x2="35" y2="32" stroke="#cc88ff" stroke-width="0.3" opacity="0.3"/>
  <!-- Liquid inside - ghostly purple -->
  <rect x="29.5" y="22" width="5" height="14" rx="1" fill="#cc88ff" opacity="0.15"/>
  <!-- Needle -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#cc88ff" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="10" x2="32" y2="12" stroke="#cc88ff" stroke-width="0.5" opacity="0.3"/>
  <!-- Plunger -->
  <rect x="30" y="40" width="4" height="2" rx="0.5" fill="#3a2a4a" stroke="#cc88ff" stroke-width="0.4" opacity="0.5"/>
  <line x1="32" y1="42" x2="32" y2="48" stroke="#cc88ff" stroke-width="1.5" opacity="0.4"/>
  <rect x="30" y="47" width="4" height="2" rx="0.5" fill="#3a2a4a" stroke="#cc88ff" stroke-width="0.4" opacity="0.5"/>
  <!-- Ghost shimmer effect -->
  <path d="M26,18 C24,22 24,28 26,32" stroke="#cc88ff" stroke-width="0.5" fill="none" opacity="0.25" stroke-dasharray="2,2"/>
  <path d="M38,18 C40,22 40,28 38,32" stroke="#cc88ff" stroke-width="0.5" fill="none" opacity="0.25" stroke-dasharray="2,2"/>
  <!-- Ghostly particles -->
  <circle cx="25" cy="24" r="0.8" fill="#cc88ff" opacity="0.2"/>
  <circle cx="39" cy="20" r="0.6" fill="#cc88ff" opacity="0.2"/>
  <circle cx="24" cy="30" r="0.5" fill="#cc88ff" opacity="0.15"/>
  <circle cx="40" cy="28" r="0.7" fill="#cc88ff" opacity="0.15"/>
</svg>