<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <linearGradient id="radGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44ff44" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22aa22" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#0a1a0a" stroke="#44ff44" stroke-width="2"/>
  <!-- Sword blade -->
  <path d="M32,12 L35,16 L34,38 L32,40 L30,38 L29,16 Z" fill="#447744" stroke="#44ff44" stroke-width="0.7" filter="url(#glow)"/>
  <!-- Blade center line -->
  <line x1="32" y1="14" x2="32" y2="38" stroke="#66ff66" stroke-width="0.5" opacity="0.7"/>
  <!-- Green radiation glow around blade -->
  <path d="M32,12 L35,16 L34,38 L32,40 L30,38 L29,16 Z" fill="url(#radGlow)" opacity="0.5"/>
  <!-- Radiation particles -->
  <circle cx="28" cy="20" r="1" fill="#44ff44" opacity="0.5"/>
  <circle cx="36" cy="24" r="0.8" fill="#44ff44" opacity="0.4"/>
  <circle cx="27" cy="30" r="0.7" fill="#44ff44" opacity="0.3"/>
  <circle cx="37" cy="18" r="0.6" fill="#44ff44" opacity="0.4"/>
  <circle cx="35" cy="34" r="0.9" fill="#44ff44" opacity="0.3"/>
  <!-- Guard -->
  <rect x="26" y="39" width="12" height="3" rx="1" fill="#336633" stroke="#44ff44" stroke-width="0.6"/>
  <!-- Handle -->
  <rect x="30" y="42" width="4" height="8" rx="0.5" fill="#2a4a2a" stroke="#44ff44" stroke-width="0.5"/>
  <!-- Pommel -->
  <circle cx="32" cy="52" r="2.5" fill="#336633" stroke="#44ff44" stroke-width="0.5"/>
  <!-- Glow wisps -->
  <path d="M27,16 C25,14 26,12 28,13" stroke="#44ff44" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M37,22 C39,20 38,18 36,19" stroke="#44ff44" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>