<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#1a0a0a" stroke="#ff8844" stroke-width="2"/>
  <!-- Dagger blade -->
  <path d="M22,12 L24,14 L23.5,34 L22,36 L20.5,34 L20,14 Z" fill="#7a5533" stroke="#ff8844" stroke-width="0.6" filter="url(#glow)"/>
  <!-- Blade center line -->
  <line x1="22" y1="14" x2="22" y2="34" stroke="#ffaa66" stroke-width="0.4" opacity="0.6"/>
  <!-- Dagger guard -->
  <rect x="18" y="35" width="8" height="2" rx="0.5" fill="#5a3322" stroke="#ff8844" stroke-width="0.5"/>
  <!-- Dagger handle -->
  <rect x="20" y="37" width="4" height="7" rx="0.5" fill="#4a2211" stroke="#ff8844" stroke-width="0.4"/>
  <!-- Handle wrap -->
  <line x1="20" y1="39" x2="24" y2="38" stroke="#ff8844" stroke-width="0.3" opacity="0.4"/>
  <line x1="20" y1="41" x2="24" y2="40" stroke="#ff8844" stroke-width="0.3" opacity="0.4"/>
  <!-- Dagger pommel -->
  <circle cx="22" cy="45" r="1.5" fill="#5a3322" stroke="#ff8844" stroke-width="0.4"/>
  <!-- Lockpick -->
  <path d="M36,16 L36,40" stroke="#ff8844" stroke-width="1.2" filter="url(#glow)"/>
  <!-- Lockpick tip (hook) -->
  <path d="M36,16 L38,14 L40,14 L40,16 L38,18" stroke="#ff8844" stroke-width="1" fill="none"/>
  <!-- Lockpick handle -->
  <path d="M36,40 L34,42 L38,42 Z" fill="#5a3322" stroke="#ff8844" stroke-width="0.5"/>
  <!-- Tension wrench -->
  <path d="M42,18 L42,38" stroke="#ff8844" stroke-width="0.8" opacity="0.7"/>
  <path d="M42,18 L44,16 L44,20 L42,18" fill="#ff8844" opacity="0.5"/>
  <!-- Lock silhouette between tools -->
  <circle cx="38" cy="30" r="3" fill="none" stroke="#ff8844" stroke-width="0.4" opacity="0.3"/>
  <rect x="36.5" y="32" width="3" height="4" rx="0.5" fill="none" stroke="#ff8844" stroke-width="0.4" opacity="0.3"/>
</svg>