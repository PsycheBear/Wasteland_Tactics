<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#0a2a1a" stroke="#66ffaa" stroke-width="2"/>
  <!-- First aid box -->
  <rect x="20" y="24" width="20" height="16" rx="2" fill="#2a5a3a" stroke="#66ffaa" stroke-width="0.8" filter="url(#glow)"/>
  <!-- Box lid -->
  <rect x="19" y="22" width="22" height="4" rx="1.5" fill="#336644" stroke="#66ffaa" stroke-width="0.6"/>
  <!-- Handle -->
  <path d="M28,20 L28,22 M36,20 L36,22" stroke="#66ffaa" stroke-width="0.8"/>
  <path d="M28,20 C28,18 36,18 36,20" stroke="#66ffaa" stroke-width="0.8" fill="none"/>
  <!-- Medical cross on box -->
  <rect x="28" y="28" width="8" height="8" rx="0.5" fill="#0a2a1a"/>
  <rect x="30.5" y="28.5" width="3" height="7" rx="0.3" fill="#66ffaa" opacity="0.9"/>
  <rect x="28.5" y="30.5" width="7" height="3" rx="0.3" fill="#66ffaa" opacity="0.9"/>
  <!-- Latch -->
  <rect x="30" y="39" width="4" height="1.5" rx="0.5" fill="#66ffaa" opacity="0.5"/>
  <!-- Stethoscope draped over -->
  <path d="M40,26 C46,28 48,34 46,38 C44,42 40,44 36,42" stroke="#66ffaa" stroke-width="1.2" fill="none" opacity="0.7"/>
  <!-- Stethoscope chest piece -->
  <circle cx="36" cy="42" r="2.5" fill="#2a5a3a" stroke="#66ffaa" stroke-width="0.6"/>
  <circle cx="36" cy="42" r="1" fill="#66ffaa" opacity="0.4"/>
  <!-- Stethoscope earpieces -->
  <circle cx="40" cy="25" r="1" fill="#66ffaa" opacity="0.5"/>
  <path d="M40,25 L42,24" stroke="#66ffaa" stroke-width="0.6" opacity="0.5"/>
</svg>