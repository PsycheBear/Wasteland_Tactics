<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#0a0a2a" stroke="#44ccff" stroke-width="2"/>
  <!-- Scope tube -->
  <rect x="14" y="28" width="32" height="8" rx="3" fill="#2a3a5a" stroke="#44ccff" stroke-width="0.7" filter="url(#glow)"/>
  <!-- Front lens -->
  <circle cx="14" cy="32" r="5" fill="#1a2a4a" stroke="#44ccff" stroke-width="0.8"/>
  <circle cx="14" cy="32" r="3" fill="#0a1a3a" stroke="#44ccff" stroke-width="0.5"/>
  <!-- Blue energy in lens -->
  <circle cx="14" cy="32" r="2" fill="#44ccff" opacity="0.3"/>
  <circle cx="14" cy="32" r="1" fill="#88ddff" opacity="0.5"/>
  <!-- Rear lens -->
  <circle cx="46" cy="32" r="4" fill="#1a2a4a" stroke="#44ccff" stroke-width="0.7"/>
  <circle cx="46" cy="32" r="2" fill="#0a1a3a" stroke="#44ccff" stroke-width="0.4"/>
  <!-- Adjustment dials -->
  <rect x="24" y="24" width="4" height="4" rx="1" fill="#3a4a6a" stroke="#44ccff" stroke-width="0.4"/>
  <rect x="32" y="36" width="4" height="4" rx="1" fill="#3a4a6a" stroke="#44ccff" stroke-width="0.4"/>
  <!-- Blue energy arcs -->
  <path d="M16,26 C20,22 28,22 32,26" stroke="#44ccff" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M32,38 C36,42 44,42 48,38" stroke="#44ccff" stroke-width="0.6" fill="none" opacity="0.4"/>
  <!-- Energy particles -->
  <circle cx="20" cy="24" r="0.8" fill="#88ddff" opacity="0.6"/>
  <circle cx="40" cy="40" r="0.8" fill="#88ddff" opacity="0.5"/>
  <circle cx="26" cy="38" r="0.6" fill="#88ddff" opacity="0.4"/>
  <!-- Crosshair in front lens -->
  <line x1="12" y1="32" x2="16" y2="32" stroke="#44ccff" stroke-width="0.3" opacity="0.6"/>
  <line x1="14" y1="30" x2="14" y2="34" stroke="#44ccff" stroke-width="0.3" opacity="0.6"/>
</svg>