<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="laserGlow"><feGaussianBlur stdDeviation="1" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#2a0a0a" stroke="#ff4444" stroke-width="2"/>
  <!-- Gun barrel -->
  <rect x="22" y="28" width="22" height="7" rx="2" fill="#4a2222" stroke="#ff4444" stroke-width="0.7" filter="url(#glow)"/>
  <!-- Barrel opening -->
  <rect x="20" y="27" width="4" height="9" rx="1" fill="#3a1a1a" stroke="#ff4444" stroke-width="0.5"/>
  <ellipse cx="21" cy="31.5" rx="1.5" ry="3.5" fill="#2a0a0a" stroke="#ff4444" stroke-width="0.3"/>
  <!-- Barrel rear -->
  <rect x="42" y="27" width="4" height="9" rx="1" fill="#3a1a1a" stroke="#ff4444" stroke-width="0.5"/>
  <!-- Rail on top -->
  <rect x="26" y="26" width="16" height="2" rx="0.5" fill="#3a1a1a" stroke="#ff4444" stroke-width="0.3"/>
  <!-- Rail notches -->
  <line x1="28" y1="26" x2="28" y2="28" stroke="#ff4444" stroke-width="0.3" opacity="0.5"/>
  <line x1="31" y1="26" x2="31" y2="28" stroke="#ff4444" stroke-width="0.3" opacity="0.5"/>
  <line x1="34" y1="26" x2="34" y2="28" stroke="#ff4444" stroke-width="0.3" opacity="0.5"/>
  <line x1="37" y1="26" x2="37" y2="28" stroke="#ff4444" stroke-width="0.3" opacity="0.5"/>
  <line x1="40" y1="26" x2="40" y2="28" stroke="#ff4444" stroke-width="0.3" opacity="0.5"/>
  <!-- Laser sight module underneath -->
  <rect x="30" y="35" width="8" height="4" rx="1" fill="#5a2222" stroke="#ff4444" stroke-width="0.5"/>
  <circle cx="31" cy="37" r="1.2" fill="#ff2222" opacity="0.8"/>
  <!-- Red laser beam -->
  <line x1="30" y1="37" x2="8" y2="37" stroke="#ff2222" stroke-width="1.5" opacity="0.7" filter="url(#laserGlow)"/>
  <line x1="30" y1="37" x2="8" y2="37" stroke="#ff4444" stroke-width="0.5" opacity="0.9"/>
  <!-- Laser dot -->
  <circle cx="8" cy="37" r="2" fill="#ff2222" opacity="0.4"/>
  <circle cx="8" cy="37" r="1" fill="#ff4444" opacity="0.6"/>
  <!-- Barrel grooves -->
  <line x1="24" y1="30" x2="24" y2="33" stroke="#ff4444" stroke-width="0.3" opacity="0.3"/>
  <line x1="27" y1="30" x2="27" y2="33" stroke="#ff4444" stroke-width="0.3" opacity="0.3"/>
</svg>