<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#0a2a0a" stroke="#66cc66" stroke-width="2"/>
  <!-- Armor torso -->
  <path d="M24,20 L22,24 L20,38 L22,44 L26,46 L32,48 L38,46 L42,44 L44,38 L42,24 L40,20 L36,18 L28,18 Z" fill="#2a5a3a" stroke="#66cc66" stroke-width="0.8" filter="url(#glow)"/>
  <!-- Color-shifting pattern - diamond tiles -->
  <polygon points="32,22 36,28 32,34 28,28" fill="#3a7a4a" opacity="0.7"/>
  <polygon points="26,24 30,28 26,32 22,28" fill="#1a4a2a" opacity="0.6"/>
  <polygon points="38,24 42,28 38,32 34,28" fill="#4a8a5a" opacity="0.5"/>
  <polygon points="32,32 36,36 32,40 28,36" fill="#1a5a3a" opacity="0.5"/>
  <polygon points="26,32 30,36 26,40 22,36" fill="#3a7a5a" opacity="0.4"/>
  <polygon points="38,32 42,36 38,40 34,36" fill="#2a6a3a" opacity="0.4"/>
  <!-- Shimmer effect -->
  <path d="M28,22 L30,20 L32,22" stroke="#aaffaa" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M36,26 L38,24 L40,26" stroke="#aaffaa" stroke-width="0.5" fill="none" opacity="0.4"/>
  <!-- Shoulder pads -->
  <ellipse cx="22" cy="22" rx="4" ry="2.5" fill="#2a5a3a" stroke="#66cc66" stroke-width="0.5"/>
  <ellipse cx="42" cy="22" rx="4" ry="2.5" fill="#2a5a3a" stroke="#66cc66" stroke-width="0.5"/>
  <!-- Transparency effect - dashed edges -->
  <path d="M20,38 L22,44 L26,46" stroke="#66cc66" stroke-width="0.4" stroke-dasharray="1,2" fill="none" opacity="0.5"/>
  <path d="M44,38 L42,44 L38,46" stroke="#66cc66" stroke-width="0.4" stroke-dasharray="1,2" fill="none" opacity="0.5"/>
</svg>