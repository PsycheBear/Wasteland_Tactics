<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a1a08"/><stop offset="100%" stop-color="#0a0a02"/></radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#ffaa44" stroke-width="2"/>
  <!-- Massive torso -->
  <path d="M22 28 Q20 36 20 46 L44 46 Q44 36 42 28 Z" fill="#5a8a3a"/>
  <path d="M24 30 Q23 36 23 44 L41 44 Q41 36 40 30 Z" fill="#6a9a4a" opacity="0.6"/>
  <!-- Head (small relative to body) -->
  <ellipse cx="32" cy="22" rx="7" ry="6" fill="#5a8a3a"/>
  <ellipse cx="32" cy="21" rx="6" ry="5" fill="#6a9a4a" opacity="0.5"/>
  <!-- Brow ridge -->
  <path d="M26 20 Q32 17 38 20" fill="none" stroke="#3a6a2a" stroke-width="2"/>
  <!-- Eyes (angry, small) -->
  <rect x="28" y="21" width="3" height="1.5" rx="0.5" fill="#ff4400"/>
  <rect x="33" y="21" width="3" height="1.5" rx="0.5" fill="#ff4400"/>
  <!-- Mouth -->
  <path d="M29 26 Q32 28 35 26" fill="none" stroke="#3a5a2a" stroke-width="1.5"/>
  <!-- Massive arms -->
  <path d="M22 30 Q14 34 10 42 Q9 45 12 44 L18 38" fill="#5a8a3a" stroke="#3a6a2a" stroke-width="1"/>
  <path d="M42 30 Q50 34 54 42 Q55 45 52 44 L46 38" fill="#5a8a3a" stroke="#3a6a2a" stroke-width="1"/>
  <!-- Fists -->
  <circle cx="10" cy="42" r="4" fill="#5a8a3a" stroke="#3a6a2a" stroke-width="0.8"/>
  <circle cx="54" cy="42" r="4" fill="#5a8a3a" stroke="#3a6a2a" stroke-width="0.8"/>
  <!-- Club in right hand -->
  <rect x="52" y="30" width="4" height="18" rx="2" fill="#8B7355" stroke="#6B5335" stroke-width="0.8" transform="rotate(15 54 39)"/>
  <rect x="51" y="28" width="6" height="5" rx="1" fill="#7a6345" stroke="#5a4325" stroke-width="0.8" transform="rotate(15 54 30)"/>
  <!-- Legs (short, thick) -->
  <rect x="24" y="44" width="7" height="10" rx="2" fill="#5a8a3a"/>
  <rect x="33" y="44" width="7" height="10" rx="2" fill="#5a8a3a"/>
  <!-- Feet -->
  <ellipse cx="27" cy="54" rx="5" ry="2" fill="#4a7a2a"/>
  <ellipse cx="37" cy="54" rx="5" ry="2" fill="#4a7a2a"/>
  <!-- Scars/stitches -->
  <line x1="30" y1="32" x2="30" y2="38" stroke="#3a6a2a" stroke-width="0.8"/>
  <line x1="34" y1="34" x2="34" y2="42" stroke="#3a6a2a" stroke-width="0.8"/>
</svg>