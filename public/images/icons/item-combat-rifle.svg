<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <polygon points="32,2 62,32 32,62 2,32" fill="#1a1a0a" stroke="#ffcc44" stroke-width="2"/>
  <!-- Rifle barrel -->
  <rect x="10" y="27" width="28" height="4" rx="1" fill="#8a7744" stroke="#ffcc44" stroke-width="0.6" filter="url(#glow)"/>
  <!-- Barrel tip / muzzle -->
  <rect x="8" y="26" width="4" height="6" rx="0.5" fill="#776633" stroke="#ffcc44" stroke-width="0.5"/>
  <!-- Receiver/action -->
  <rect x="28" y="25" width="14" height="8" rx="1.5" fill="#6a5533" stroke="#ffcc44" stroke-width="0.7"/>
  <!-- Magazine -->
  <rect x="33" y="33" width="5" height="10" rx="1" fill="#5a4422" stroke="#ffcc44" stroke-width="0.5"/>
  <!-- Stock -->
  <path d="M42,26 L50,22 L52,24 L52,34 L50,36 L42,33 Z" fill="#7a6644" stroke="#ffcc44" stroke-width="0.6"/>
  <!-- Grip -->
  <path d="M38,33 L36,42 L40,42 L42,33" fill="#5a4422" stroke="#ffcc44" stroke-width="0.5"/>
  <!-- Sight -->
  <rect x="20" y="24" width="2" height="3" fill="#ffcc44" opacity="0.7"/>
  <rect x="36" y="23" width="2" height="2" fill="#ffcc44" opacity="0.7"/>
  <!-- Detail lines -->
  <line x1="30" y1="28" x2="40" y2="28" stroke="#ffcc44" stroke-width="0.3" opacity="0.4"/>
  <line x1="44" y1="26" x2="48" y2="24" stroke="#ffcc44" stroke-width="0.3" opacity="0.4"/>
</svg>