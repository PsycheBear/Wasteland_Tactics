<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" role="presentation">
  <rect x="0" y="4" width="6" height="16" fill="#00ff00">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="9" y="4" width="2" height="16" fill="#00ff00" fill-opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="13" y="4" width="1" height="16" fill="#00ff00" fill-opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.1;0.35" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
</svg>
