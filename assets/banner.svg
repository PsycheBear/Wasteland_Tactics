<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Wasteland Tactics">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d0d08" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a08"/>
      <stop offset="50%" stop-color="#0d0d08"/>
      <stop offset="100%" stop-color="#080807"/>
    </linearGradient>
    <pattern id="scanlines" x="0" y="0" width="3" height="4" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" fill-opacity="0.35"/>
    </pattern>
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b1"/>
      <feGaussianBlur stdDeviation="1.2" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#screenGlow)"/>

  <rect x="10" y="10" width="1180" height="340" fill="none" stroke="#00ff00" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="18" y="18" width="1164" height="324" fill="none" stroke="#00ff00" stroke-opacity="0.18" stroke-width="1"/>

  <g font-family="'Courier New', 'Consolas', monospace" font-size="14" fill="#00ff00" fill-opacity="0.85">
    <text x="34" y="44">ROBCO INDUSTRIES (TM) TERMLINK</text>
    <text x="1166" y="44" text-anchor="end">VAULT-OS v2.77</text>
  </g>
  <line x1="34" y1="54" x2="1166" y2="54" stroke="#00ff00" stroke-opacity="0.4"/>

  <g filter="url(#phosphor)">
    <text x="600" y="170" font-family="'Courier New', 'Consolas', monospace" font-size="86" font-weight="bold" fill="#00ff00" text-anchor="middle" letter-spacing="8">WASTELAND</text>
    <text x="600" y="250" font-family="'Courier New', 'Consolas', monospace" font-size="86" font-weight="bold" fill="#00ff00" text-anchor="middle" letter-spacing="8">TACTICS</text>
  </g>

  <g filter="url(#amber-glow)">
    <text x="600" y="290" font-family="'Courier New', 'Consolas', monospace" font-size="20" fill="#ffb000" text-anchor="middle" letter-spacing="6">A POST-APOCALYPTIC AUTO-BATTLER</text>
  </g>

  <g font-family="'Courier New', 'Consolas', monospace" font-size="14" fill="#00ff00" fill-opacity="0.85">
    <text x="34" y="328">&gt; STATUS: OPERATIONAL</text>
    <text x="1166" y="328" text-anchor="end">[ AUTHENTICATED ]</text>
  </g>

  <rect width="1200" height="360" fill="url(#scanlines)"/>
  <rect width="1200" height="360" fill="url(#vignette)"/>
</svg>
